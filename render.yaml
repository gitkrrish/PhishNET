# Render service for the PhishNet / Viper Trace API.
#
# The 24x7 monitoring scheduler runs inside this Node process
# (backend/services/intel/monitoringService.mjs, 30s tick), so this backend
# must stay on a long-running Node host. It cannot run on Vercel serverless.
#
# `name` is deliberately omitted: Render service names are globally unique,
# and `phishnet-api` is already taken on Render by an unrelated Python
# service ("Phishing Detection API"). A blueprint that names an existing
# service fails to provision, which is why the API was never reachable at
# the URL the Vercel rewrite was pointing at. Leaving the name unset lets
# Render allocate a free one.
#
# After the first successful deploy, copy the service's URL into the Vercel
# project as PHISHNET_API_ORIGIN (no trailing slash). tracewall/vercel.json
# expands it for the /api/:path* rewrite at request time.
services:
  - type: web
    runtime: node
    region: oregon
    plan: free
    rootDir: tracewall
    buildCommand: npm install --omit=dev
    startCommand: node --experimental-sqlite backend/server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: CORS_ORIGIN
        sync: false
      - key: SESSION_HOURS
        value: "8"
      - key: DEMO_PASSWORD
        sync: false
      - key: MAX_BODY_BYTES
        value: "5242880"
      - key: EMAIL_DNS_SERVERS
        value: "8.8.8.8,8.8.4.4"
      - key: AZURE_DNS_SERVER
        value: "168.63.129.16"
      - key: IP_ANALYSIS_TIMEOUT_MS
        value: "10000"
      - key: EMAIL_ANALYSIS_TIMEOUT_MS
        value: "5000"
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: OTX_API_KEY
        sync: false
      - key: IPWHO_API_KEY
        sync: false
      - key: IPINFO_TOKEN
        sync: false
      - key: IPQUALITYSCORE_API_KEY
        sync: false
      - key: PROXYCHECK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
